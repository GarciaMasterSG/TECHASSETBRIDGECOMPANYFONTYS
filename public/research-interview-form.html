<!doctype html>
<html lang="en">
  <head><meta charset="utf-8" /><title>Research interview form registration</title></head>
  <body>
    <form name="research-interview" method="POST" data-netlify="true" netlify-honeypot="bot-field" hidden>
      <input type="hidden" name="form-name" value="research-interview" />
      <input name="name" />
      <input name="email" type="email" />
      <input name="organisation" />
      <select name="role">
        <option>High-tech SME</option>
        <option>Bank / lender</option>
        <option>Leasing / vendor-finance provider</option>
        <option>Ecosystem / public financing organisation</option>
        <option>Other</option>
      </select>
      <textarea name="message"></textarea>
      <input name="consent" type="checkbox" value="yes" />
      <input name="bot-field" />
    </form>
  </body>
</html>
