<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>Contact form registration</title>
  </head>
  <body>
    <form
      name="contact"
      method="POST"
      data-netlify="true"
      netlify-honeypot="bot-field"
      hidden
    >
      <input type="hidden" name="form-name" value="contact" />
      <input name="name" />
      <input name="company" />
      <input name="email" type="email" />
      <input name="phone" type="tel" />
      <select name="service">
        <option>Equipment Finance Diagnostic</option>
        <option>Financing Structure Comparison</option>
        <option>Lender Discussion Pack</option>
        <option>Not sure yet — general enquiry</option>
      </select>
      <textarea name="message"></textarea>
      <input name="consent" type="checkbox" value="yes" />
      <input name="bot-field" />
    </form>
  </body>
</html>
